[project]
name = "agent-animal-voice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=0.3.5",
    "cloudpickle==3.0",
    "google-adk[a2a]>=1.21.0",
    "google-cloud-aiplatform>=1.130.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["animal_voice_agent"]

[tool.uv.sources]
google-adk = { git = "https://github.com/google/adk-python", branch = "main" }
